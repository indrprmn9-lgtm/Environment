name: Auto Deploy to Firebase Hosting (Free Spark Plan)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Prepare Firebase credentials & deploy to Firebase Hosting
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0280945316 }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0280945316 belum diisi di GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          SA_PATH="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SA_JSON" > "$SA_PATH"
          if ! node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!j.client_email||!j.private_key) process.exit(1);" "$SA_PATH"; then
            rm -f "$SA_PATH"
            echo "::error::Isi secret FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0280945316 bukan JSON Service Account yang valid. Salin utuh file .json dari { sampai }."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH"
          npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0280945316 --non-interactive
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "Menyinkronkan Firestore Security Rules ke database ai-studio-7b2a8c16-10a9-4175-b9c0-10d04b4376bf..."
            npx --yes firebase-tools deploy --only firestore:rules --project gen-lang-client-0280945316 --non-interactive || echo "::warning::Hosting berhasil diunggah, namun deploy otomatis firestore:rules dilewati karena izin Service Account. Jika perlu, salin isi firestore.rules ke Firebase Console > Firestore Database (ai-studio-7b2a8c16-10a9-4175-b9c0-10d04b4376bf) > Rules > Publish."
          fi
          rm -f "$SA_PATH"
          exit $STATUS
